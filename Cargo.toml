[workspace]
resolver = "3"
members = [
    "crates/ports",
    "crates/runtime",
    "crates/panel-uc8179",
    "crates/boot-screen",
    "crates/compositor",
    "crates/firmware",
    "crates/provtool",
    "crates/dev-cli",
]
# `crates/sim` lives in its own repo (paperanywhere/simulator) so a sim
# clone doesn't have to pull the entire firmware tree + esp toolchain
# expectations. It consumes the shared crates above via git deps.
exclude = ["crates/sim"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Shared no_std utilities used by both the firmware bin and the runtime crate.
heapless = "0.8"
log = "0.4"

# Internal crates — referenced by paperanywhere-firmware and paperanywhere-sim
# via the workspace; never published.
paperanywhere-ports = { path = "crates/ports" }
paperanywhere-runtime = { path = "crates/runtime" }
paperanywhere-panel-uc8179 = { path = "crates/panel-uc8179" }
paperanywhere-boot-screen = { path = "crates/boot-screen" }
paperanywhere-compositor = { path = "crates/compositor" }

# UI drawing primitives for the compositor's status bar (battery icon,
# wifi icon, version + build text). no_std-friendly; ~30 KB of code in
# the firmware image once linked.
embedded-graphics = "0.8"

# Release profile is workspace-wide so the firmware binary inherits LTO + size
# optimizations no matter which member crate's settings apply. The sim binary
# benefits from these too (smaller, faster), and the firmware needs them for
# flash budget.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false
# Debug info kept for now while we're chasing the 0-byte alloc panic — set
# back to `false` + `strip = "symbols"` once the path is stable. The flash
# image size grows by ~hundreds of KB with debug on but it stays in the
# 2 MB app slot.
debug = true
strip = "none"

[profile.dev]
opt-level = 1
panic = "abort"

# Fast-flash dev profile: opt-3 (so esp-radio/embassy panics don't fire on
# size-zero patterns the way they do in unoptimized builds) but no LTO. Cuts
# firmware compile time from ~60s to ~10s vs `release`. Use during iteration:
# `cargo build --profile release-dev ...`. Hand-off builds still use full LTO
# via `--release`.
[profile.release-dev]
inherits = "release"
lto = "off"
codegen-units = 16
debug = true
strip = "none"
