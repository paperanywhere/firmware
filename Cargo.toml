[package]
name = "paperanywhere-firmware"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "ESP32-S3 firmware for paperanywhere e-paper devices (reTerminal E-series + bare panels)."

[[bin]]
name = "paperanywhere-firmware"
path = "src/main.rs"

# Board feature flags — mutually exclusive at compile time.
# Pick one when building: `cargo build --features board-reterminal-e1001`
[features]
default = ["board-reterminal-e1001"]
board-reterminal-e1001 = []
board-reterminal-e1002 = []
board-reterminal-e1003 = []
board-reterminal-e1004 = []
board-inkplate-6 = []
board-inkplate-10 = []
board-generic-esp32s3-waveshare-75 = []

[dependencies]
# Shared wire types — public repo, no auth needed.
paperanywhere-proto = { git = "https://github.com/paperanywhere/proto", branch = "main", default-features = false }

# ── esp-rs 1.x matrix (uses naked_asm! — works on modern rust) ──
esp-hal = { version = "1.1", features = ["esp32s3", "unstable"] }
esp-backtrace = { version = "0.19", features = ["esp32s3", "panic-handler", "println"] }
esp-println = { version = "0.17", features = ["esp32s3", "log-04"] }
esp-storage = { version = "0.9", features = ["esp32s3"] }
esp-alloc = "0.9"
# esp-wifi + esp-hal-embassy come back in M4 when we wire the radio + async
# executor. They aren't on crates.io with a matrix that lines up against
# esp-hal 1.1 yet (esp-hal-embassy 0.9 wants 1.0.0-rc.x's private feature).

# ── State / utility ──
embedded-hal = "1"
embedded-storage = "0.3"
heapless = "0.8"
log = "0.4"
static_cell = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false
debug = false
strip = "symbols"

[profile.dev]
opt-level = 1
panic = "abort"
