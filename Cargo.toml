[package]
name = "paperanywhere-firmware"
version = "0.1.0"
edition = "2024"
resolver = "3"
license = "MIT OR Apache-2.0"
description = "ESP32-S3 firmware for paperanywhere e-paper devices (reTerminal E-series + bare panels)."

[[bin]]
name = "paperanywhere-firmware"
path = "src/main.rs"

[features]
default = ["board-reterminal-e1001"]
board-reterminal-e1001 = []
board-reterminal-e1002 = []
board-reterminal-e1003 = []
board-reterminal-e1004 = []
board-inkplate-6 = []
board-inkplate-10 = []
board-generic-esp32s3-waveshare-75 = []

[dependencies]
# ── esp-rs (minimum verified-on-CI matrix) ──
# Networking deps (esp-wifi, esp-storage, embassy) live behind a feature flag
# that's off in CI today because their crates.io versions don't line up
# against esp-hal 1.1 yet (private __esp_wifi_builtin_scheduler /
# __esp_hal_embassy features on 1.1 vs 1.0.0). Once esp-rs cuts a matching
# release the `with-radio` feature wires them back in.
esp-hal = { version = "1.1", features = ["esp32s3", "unstable"] }
esp-backtrace = { version = "0.19", features = ["esp32s3", "panic-handler", "println"] }
esp-println = { version = "0.17", features = ["esp32s3", "log-04"] }
esp-alloc = "0.9"
esp-sync = { version = "0.1", features = ["esp32s3"] }

# ── State / utility ──
embedded-hal = "1"
heapless = "0.8"
log = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false
debug = false
strip = "symbols"

[profile.dev]
opt-level = 1
panic = "abort"
