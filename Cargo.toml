[package]
name = "paperanywhere-firmware"
version = "0.1.0"
edition = "2024"
resolver = "3"
license = "MIT OR Apache-2.0"
description = "ESP32-S3 firmware for paperanywhere e-paper devices (reTerminal E-series + bare panels)."

[[bin]]
name = "paperanywhere-firmware"
path = "src/main.rs"

# Board feature flags — mutually exclusive at compile time.
# Pick one when building: `cargo build --features board-reterminal-e1001`
[features]
default = ["board-reterminal-e1001"]
board-reterminal-e1001 = []
board-reterminal-e1002 = []
board-reterminal-e1003 = []
board-reterminal-e1004 = []
board-inkplate-6 = []
board-inkplate-10 = []
board-generic-esp32s3-waveshare-75 = []

[dependencies]
# Note on paperanywhere-proto: temporarily dropped from the firmware to avoid
# a cargo serde-feature-unification trap. esp-hal-procmacros 0.22 pulls
# serde_yaml (for chip metadata), which forces serde+std on, which then makes
# proto's serde+no_std unifiable target build fail to find host std. The fix
# is in esp-rs's tooling, not here; until it lands, the firmware doesn't use
# proto types directly. Local stubs in src/wire_stub.rs cover the protocol
# surface; when proto is re-attached they'll be replaced.

# ── esp-rs 1.x matrix (uses naked_asm! — works on modern rust) ──
esp-hal = { version = "1.1", features = ["esp32s3", "unstable"] }
esp-backtrace = { version = "0.19", features = ["esp32s3", "panic-handler", "println"] }
esp-println = { version = "0.17", features = ["esp32s3", "log-04"] }
esp-alloc = "0.9"
# Transitive of esp-hal that doesn't auto-propagate the chip feature.
esp-sync = { version = "0.1", features = ["esp32s3"] }

# ── State / utility ──
embedded-hal = "1"
heapless = "0.8"
log = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false
debug = false
strip = "symbols"

[profile.dev]
opt-level = 1
panic = "abort"
