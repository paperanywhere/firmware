[package]
name = "paperanywhere-firmware"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "ESP32-S3 firmware for paperanywhere e-paper devices (reTerminal E-series + bare panels)."

[[bin]]
name = "paperanywhere-firmware"
path = "src/main.rs"

# Board feature flags — mutually exclusive at compile time.
# Pick one when building: `cargo build --features board-reterminal-e1001`
[features]
default = ["board-reterminal-e1001"]
board-reterminal-e1001 = []
board-reterminal-e1002 = []
board-reterminal-e1003 = []
board-reterminal-e1004 = []
board-inkplate-6 = []
board-inkplate-10 = []
board-generic-esp32s3-waveshare-75 = []

[dependencies]
# Shared wire types — public repo, no auth needed.
paperanywhere-proto = { git = "https://github.com/paperanywhere/proto", branch = "main", default-features = false }

# ── esp-rs core (matched matrix; bump esp-hal + esp-wifi + esp-storage + esp-hal-embassy together) ──
esp-hal = { version = "0.22", features = ["esp32s3"] }
esp-hal-embassy = { version = "0.5", features = ["esp32s3"] }
esp-backtrace = { version = "0.14", features = ["esp32s3", "panic-handler", "exception-handler", "println"] }
esp-println = { version = "0.12", features = ["esp32s3", "log"] }
esp-wifi = { version = "0.11", default-features = false, features = ["esp32s3", "wifi"] }
esp-storage = { version = "0.4", features = ["esp32s3"] }
esp-alloc = "0.5"

# ── Embassy runtime (timer + executor only; net stack comes later in M4) ──
embassy-executor = { version = "0.6", features = ["task-arena-size-32768", "executor-thread"] }
embassy-time = "0.3"

# ── State / utility ──
embedded-hal = "1"
heapless = "0.8"
log = "0.4"
static_cell = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false
debug = false
strip = "symbols"

[profile.dev]
opt-level = 1
panic = "abort"
