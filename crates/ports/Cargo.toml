[package]
name = "paperanywhere-ports"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Port traits + wire types shared by the device firmware and the desktop simulator."

# no_std crate. Both consumers (firmware: xtensa-esp32s3-none-elf, sim: host)
# need the same surface, so we only depend on `alloc`. heapless is reused for
# fixed-size string buffers in credentials so it survives at the firmware
# boundary without forcing every consumer to drag in a String.
[dependencies]
heapless.workspace = true
# Mutex wrapping the global chrome state. CriticalSectionRawMutex works
# both on the firmware (cross-core safe via critical-section's esp-hal
# impl) and the sim (no-op CS on host).
embassy-sync = "0.8"
# Cardstock playlist schema. Carried by `DeviceState.playlist` so the
# runtime can hand it to the panel actor. Deserialised via serde_json
# below.
cardstock = { workspace = true }
# Canonical wire-type definitions shared with the backend. We pull
# proto with `default-features = false` so the `ws` feature stays
# off (its ulid serde impl needs std, which we don't have on
# firmware). Polling-protocol types (DeviceState, DeviceAck, etc.)
# live in proto's always-on module.
paperanywhere-proto = { workspace = true }
# Full serde_json — no_std with alloc — to deserialise the playlist
# field of the /state response. The hand-rolled extract_str path is
# fine for flat fields but the nested Card variants need real serde.
serde_json = { version = "1", default-features = false, features = ["alloc"] }
