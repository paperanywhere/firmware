[package]
name = "paperanywhere-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Device-runtime polling loop shared between paperanywhere firmware and the desktop simulator."

# no_std crate. Pulls in only `paperanywhere-ports` (also no_std) and the
# generic `log` facade so the loop can record progress via whatever logger the
# host hooks up (`esp-println` on firmware, `env_logger` on sim).
[dependencies]
paperanywhere-ports.workspace = true
log.workspace = true
# Used for polling `WifiLink::local_ip()` after associate with a small
# back-off. `generic-queue-8` matches the firmware crate's feature so
# Timer works regardless of which task drives the executor.
embassy-time = { version = "0.5", features = ["generic-queue-8"] }
# Used for racing the wake-cycle sleep against the OTA progress signal:
# when the OTA install path fires a new OtaPhase, runtime breaks out
# of sleep and renders the live progress view instead of waiting the
# full interval. The signal type itself lives in the firmware crate
# as a static; runtime receives a `&'static Signal<...>` from `run()`.
embassy-sync = "0.7"
embassy-futures = "0.1"
heapless = "0.8"
