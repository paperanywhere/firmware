[package]
name = "paperanywhere-compositor"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Layered framebuffer + status-bar compositor that sits between the runtime and the panel driver. Status bar lives at the top of the screen; the runtime owns the main region."

[build-dependencies]
# Host-side SVG → 1bpp rasteriser. Reused for the boot screen logo
# and for the Font Awesome icons baked by build.rs.
paperanywhere-boot-screen = { workspace = true }
paperanywhere-ports = { workspace = true }

[dependencies]
paperanywhere-ports = { workspace = true }
embedded-graphics = { workspace = true }
heapless = { workspace = true }
log = { workspace = true }
