[package]
name = "paperanywhere-compositor"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Layered framebuffer + status-bar compositor that sits between the runtime and the panel driver. Status bar lives at the top of the screen; the runtime owns the main region."

[build-dependencies]
# Direct SVG → 1bpp icon rasteriser (lives in build.rs). We don't go
# through the boot-screen crate's pipeline for icons because that
# pipeline Floyd-Steinberg-dithers the result, which produces noisy
# edges at icon scales (20 px). Icons need a hard alpha threshold so
# antialiased strokes either become solid ink or disappear.
resvg = "0.43"
usvg = "0.43"
tiny-skia = "0.11"

[dependencies]
paperanywhere-ports = { workspace = true }
embedded-graphics = { workspace = true }
heapless = { workspace = true }
log = { workspace = true }
# NOTE: QR encoding for the adoption screen is deferred — qrcodegen
# 1.x requires std even with default features off. Adoption screen
# currently shows a placeholder where the QR will go. See task in
# the tracker for "Adoption screen: no_std QR encoder".
