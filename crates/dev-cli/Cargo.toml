[package]
name = "paperanywhere-dev"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Developer CLI for paperanywhere — wraps espflash + provtool, tails logs."

[[bin]]
name = "pa-dev"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
log = { workspace = true }
env_logger = "0.11"
