[package]
name = "paperanywhere-sim"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Desktop simulator for paperanywhere — runs the device runtime against a virtual e-paper display."

[[bin]]
name = "paperanywhere-sim"
path = "src/main.rs"

[dependencies]
paperanywhere-ports.workspace = true
paperanywhere-runtime.workspace = true
paperanywhere-panel-uc8179.workspace = true
paperanywhere-boot-screen.workspace = true

# embedded-hal is the trait surface the UC8179 driver speaks; the sim
# implements it with fake transports (SPI recorder + dummy GPIO/Delay) so
# the same byte-exact protocol runs here as on the device.
embedded-hal = "1"

# UI: eframe is the egui app harness — gives us a window + the side-panel
# layout we want for the mock telemetry without standing up winit/wgpu by hand.
# Default features include glow (OpenGL renderer); fine on Windows/Mac/Linux.
eframe = "0.28"
egui = "0.28"

# HTTP: async reqwest (matches the now-async `HttpTransport` trait surface)
# with rustls-tls so we don't link against system OpenSSL. `stream` exposes
# `bytes_stream` for the chunked /blob download.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
# tokio drives the runtime task; multi-threaded so `thread::sleep` inside
# the SimSleeper impl doesn't starve the network calls running on other
# workers.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
# `bytes_stream`'s combinator surface (StreamExt) lives here.
futures-util = "0.3"

# Persistence + config:
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"  # for picking a sane data dir per OS

# Logging: env_logger prints to stderr; users can RUST_LOG=info cargo run.
env_logger = "0.11"
log.workspace = true

# Heapless is referenced by the ports trait surface (WifiCreds). We don't
# directly use it on the sim side, but enabling its alloc feature keeps the
# String <-> heapless::String conversions painless if the sim ever needs them.
heapless.workspace = true
