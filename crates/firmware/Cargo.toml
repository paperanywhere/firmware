[package]
name = "paperanywhere-firmware"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ESP32-S3 firmware for paperanywhere e-paper devices (reTerminal E-series + bare panels)."

[[bin]]
name = "paperanywhere-firmware"
path = "src/main.rs"

# Host build script that rasterises `assets/logo.svg` into panel-native bytes
# for the active board feature. Emits a binary the firmware `include_bytes!`s.
[build-dependencies]
paperanywhere-boot-screen.workspace = true
paperanywhere-ports.workspace = true

[features]
default = ["board-reterminal-e1001"]
board-reterminal-e1001 = []
board-reterminal-e1002 = []
board-reterminal-e1003 = []
board-reterminal-e1004 = []
board-inkplate-6 = []
board-inkplate-10 = []
board-generic-esp32s3-waveshare-75 = []
# Hard-disable OTA at the compile-time level. With this on, ota.rs is
# replaced by a no-op stub and the sha2 + esp-bootloader-esp-idf
# ota_updater paths are excluded from the binary entirely — useful for
# releases where the OTA code must not exist (security audits, locked-
# down firmware). For normal dev workflows, prefer the NVS-level dev
# flag baked in via `provtool --dev` instead.
dev-no-ota = []

[dependencies]
# ── shared paperanywhere crates (workspace) ──
paperanywhere-ports.workspace = true
paperanywhere-runtime.workspace = true
paperanywhere-panel-uc8179.workspace = true
paperanywhere-compositor.workspace = true

# ── SD card stack ──
# embedded-sdmmc: SPI-mode SD card driver + FAT16/FAT32 filesystem.
# We use SPI mode (not native SDMMC) because esp-hal 1.1 doesn't
# expose an SDMMC peripheral driver, and the reTerminal E1001
# schematic wires the SD slot in SPI mode anyway (SCK=GPIO7,
# MOSI=GPIO9, MISO=GPIO8, CS=GPIO14, DET=GPIO15, EN=GPIO16).
embedded-sdmmc = { version = "0.8", default-features = false }
# critical-section: explicitly declared so the panel+SD shared
# bus type alias in boards/mod.rs (`SharedSpiBus`) can name
# `critical_section::Mutex`. The crate is transitively pulled in
# by esp-hal already; surfacing it as a direct dep removes the
# implicit-prelude footgun.
critical-section = "1"
# embedded-hal-bus's bus-sharing wrappers (CriticalSectionDevice)
# are what we need for the panel+SD shared SPI2 refactor. The
# existing dep declaration further down enables `async` (panel
# requirement); we just rely on that.

# ── esp-rs (current matrix) ──
# `esp-wifi` was renamed to `esp-radio` for the 1.x line. `esp-radio` 0.18 uses
# the new `esp-rtos` scheduler crate instead of the private feature on esp-hal
# that the old `esp-wifi` 0.15 required. That fixes the resolver.
esp-hal = { version = "1.1", features = ["esp32s3", "unstable"] }
esp-radio = { version = "0.18", features = ["esp32s3", "wifi"] }
# `esp-radio` feature gates the module inside esp-rtos that registers the
# `esp_rtos_*` scheduler/queue/semaphore/timer ABI symbols esp-radio's wifi
# driver expects. Without it, link fails with "undefined reference to
# esp_rtos_initialized" et al.
esp-rtos = { version = "0.3", features = ["esp32s3", "esp-radio", "embassy"] }
esp-storage = { version = "0.9", features = ["esp32s3", "critical-section"] }
esp-backtrace = { version = "0.19", features = ["esp32s3", "panic-handler", "println"] }
# `jtag-serial` routes println output to the ESP32-S3's native
# USB-Serial-JTAG endpoint instead of UART0. On the reTerminal E1001
# the single USB-C port IS the USB-Serial-JTAG — UART0 GPIO pins are
# not wired to a bridge chip, so without this feature every println
# silently lands on unrouted pins and the serial monitor sees nothing.
#
# `default-features = false` is required because the default `auto`
# feature counts as an output-channel selection — esp-println rejects
# the build with "exactly one of jtag-serial/uart/auto/no-op" if both
# `auto` (from defaults) and `jtag-serial` are enabled.
# TEMP: routed to UART0 (via CH340 → COM6) instead of jtag-serial so
# we can actually read device logs on this workstation — Windows
# doesn't expose the ESP32-S3's native USB-Serial-JTAG endpoint as a
# COM port, only the CH340 bridge that's wired to UART0. Flip back to
# `jtag-serial` once the OTA-driven-from-backend flow (task #93) is
# stable enough that we don't need continuous serial diagnostics
# (memory note `project_reterminal_usb_serial_jtag` originally
# specified jtag-serial because that's how the production device
# config should be — but right now diagnostics > production-fidelity).
esp-println = { version = "0.17", default-features = false, features = ["esp32s3", "log-04", "uart", "critical-section"] }
esp-alloc = "0.10"
esp-sync = { version = "0.1", features = ["esp32s3"] }
# Embeds the ESP-IDF app descriptor in the image so espflash + the second-stage
# bootloader can validate and run it. Also exposes `ota_updater::OtaUpdater`
# for swapping app slots during firmware updates.
esp-bootloader-esp-idf = { version = "0.5", features = ["esp32s3"] }
# Streaming SHA-256 for the OTA download path — verifies the downloaded
# image matches the backend's advertised hash chunk-by-chunk so we never
# touch otadata with a bad slot.
sha2 = { version = "0.10", default-features = false }

# ── State / utility ──
embedded-hal = "1"
# `ExclusiveDevice` glues an `embedded-hal::spi::SpiBus` (what esp-hal's
# `Spi` exposes) + a CS `OutputPin` into the `SpiDevice` interface the
# UC8179 driver wants. Single-bus pattern; we don't share the SPI with any
# other peripheral.
# `async` feature wires `AsyncSpiDevice` for `ExclusiveDevice`, which the
# UC8179 driver requires now that its SpiDevice bound is async (the SPI
# transfer awaits on each FIFO refill instead of busy-polling, giving
# embassy-net scheduling windows during the framebuffer flush).
embedded-hal-bus = { version = "0.2", features = ["async"] }
embedded-storage = "0.3"
heapless.workspace = true
log.workspace = true
# `embassy-futures::block_on` drives esp-radio's async connect/disconnect
# from inside the sync `WifiLink` impl — that part stays sync.
embassy-futures = "0.1"
# Full embassy stack: the runtime is now async, the executor runs our
# runtime task and the embassy-net runner as siblings on core 0.
embassy-executor = "0.10"
embassy-net = { version = "0.7", default-features = false, features = ["proto-ipv4", "medium-ethernet", "tcp", "dhcpv4", "dns"] }
embassy-net-driver = "0.2"
embassy-sync = "0.7"
# `generic-queue-8` enables a software timer queue that doesn't require
# the calling task's waker to come from `embassy_executor`. We need it
# because the WifiLink::associate path uses `embassy_futures::block_on`
# (the WifiLink trait is sync) and tries to race the connect future
# against a `Timer::after(...)`. Without this feature, embassy_time
# panics with "Found waker not created by the Embassy executor".
embassy-time = { version = "0.5", features = ["generic-queue-8"] }
# Dual-versioned because the ecosystem split mid-2024: embassy-net (and other
# embassy-* crates) still expose `embedded-io-async 0.6` (and `embedded-io
# 0.6`) traits, while embedded-tls 0.18 adopted 0.7. A tiny adapter in
# `http.rs` bridges them.
embedded-io = "0.6"
embedded-io-async = "0.6"
embedded-io-07 = { package = "embedded-io", version = "0.7" }
embedded-io-async-07 = { package = "embedded-io-async", version = "0.7" }
# Pure-Rust TLS 1.3 (no_std, async). Wrapped around `embassy_net::tcp::
# TcpSocket` for `https://` backend URLs. The handshake needs a CryptoRng;
# we pass `esp_hal::rng::Rng` via a thin rand_core adapter (see http.rs).
embedded-tls = { version = "0.18", default-features = false }
rand_core = "0.6"
static_cell = "2"
