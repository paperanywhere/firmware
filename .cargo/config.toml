[build]
target = "xtensa-esp32s3-none-elf"

[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor --partition-table flash/partition-table.csv"
rustflags = [
  "-C", "link-arg=-Tlinkall.x",
  "-C", "link-arg=-nostartfiles",
]

[unstable]
# Xtensa rust ships without prebuilt std/core for the target — rebuild from
# rust-src. The `panic_immediate_abort` build-std-feature was renamed to a
# real panic strategy in newer rust; we get the same effect via the
# `panic = "abort"` profile setting in Cargo.toml.
build-std = ["alloc", "core"]
