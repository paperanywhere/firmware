[build]
target = "xtensa-esp32s3-none-elf"

[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor --partition-table flash/partition-table.csv"
rustflags = [
  "-C", "link-arg=-Tlinkall.x",
  "-C", "link-arg=-nostartfiles",
]

# `-Z build-std` is passed on the cargo CLI (`-Z build-std=core,alloc`) rather
# than configured in [unstable] here, so it applies only to the requested
# --target. Setting it in [unstable] applied it to host proc-macro builds too,
# which then failed with "can't find crate for std" because no_std proc-macros
# don't have a host std.
